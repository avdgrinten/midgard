name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Format, lint and test (Linux host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl
      - name: rustfmt
        run: cargo fmt --all --check
      # The guest's crates are a workspace of their own (see guest-crates/Cargo.toml).
      - name: rustfmt (guest)
        working-directory: guest-crates
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The guest's crates only do anything on Linux guests, where they are static musl
      # binaries.
      - name: clippy (guest, musl)
        working-directory: guest-crates
        run: cargo clippy --workspace --target x86_64-unknown-linux-musl --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked
      - name: test (guest)
        working-directory: guest-crates
        run: cargo test --workspace --locked
      - name: build (guest, musl)
        working-directory: guest-crates
        run: cargo build --workspace --release --target x86_64-unknown-linux-musl --locked
